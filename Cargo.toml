[package]
name = "netscan"
version = "0.2.4"
edition = "2021"
description = "Fast IP and port scanner with device detection (OS, vendor, model), network map and Excel export - Windows and macOS"
license = "MIT"
authors = ["Elia Gantenbein"]
repository = "https://github.com/eliagantenbein/netscan"
readme = "README.md"
keywords = ["ip-scanner", "network-scanner", "port-scanner", "lan", "network"]
categories = ["network-programming", "gui"]

[profile.release]
lto = true
codegen-units = 1
strip = true

# Full DWARF for egui/wgpu makes debug and test binaries ~400 MB, which Windows then refuses to start
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
egui_extras = "0.37.0"
rfd = "0.18.0"
rust_xlsxwriter = "0.102.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
